<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="45%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2029"/>
      <stop offset="100%" stop-color="#090c11"/>
    </linearGradient>
    <radialGradient id="lamp" cx="78%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#2997FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2997FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2997FF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#lamp)"/>
  <!-- Far skyline -->
  <g fill="#0b1018">
    <rect x="40" y="300" width="180" height="260"/>
    <rect x="240" y="240" width="140" height="320"/>
    <rect x="400" y="280" width="220" height="280"/>
    <rect x="640" y="210" width="160" height="350"/>
    <rect x="840" y="260" width="200" height="300"/>
    <rect x="1080" y="190" width="180" height="370"/>
    <rect x="1300" y="250" width="260" height="310"/>
  </g>
  <!-- Windows -->
  <g fill="url(#glass)">
    <rect x="70" y="340" width="22" height="14"/><rect x="110" y="340" width="22" height="14"/><rect x="150" y="340" width="22" height="14"/>
    <rect x="70" y="380" width="22" height="14"/><rect x="110" y="380" width="22" height="14"/>
    <rect x="270" y="280" width="20" height="12"/><rect x="310" y="280" width="20" height="12"/>
    <rect x="270" y="320" width="20" height="12"/><rect x="310" y="360" width="20" height="12"/>
    <rect x="450" y="320" width="24" height="14"/><rect x="500" y="320" width="24" height="14"/><rect x="550" y="320" width="24" height="14"/>
    <rect x="680" y="250" width="22" height="12"/><rect x="720" y="250" width="22" height="12"/>
    <rect x="880" y="300" width="24" height="14"/><rect x="930" y="300" width="24" height="14"/>
    <rect x="1120" y="230" width="22" height="12"/><rect x="1165" y="230" width="22" height="12"/>
    <rect x="1120" y="280" width="22" height="12"/><rect x="1165" y="330" width="22" height="12"/>
    <rect x="1360" y="290" width="28" height="16"/><rect x="1420" y="290" width="28" height="16"/>
  </g>
  <!-- Fence / gate -->
  <rect x="860" y="480" width="420" height="14" fill="#2a3340"/>
  <g stroke="#3a4554" stroke-width="3">
    <line x1="900" y1="494" x2="900" y2="560"/><line x1="960" y1="494" x2="960" y2="560"/>
    <line x1="1020" y1="494" x2="1020" y2="560"/><line x1="1080" y1="494" x2="1080" y2="560"/>
    <line x1="1140" y1="494" x2="1140" y2="560"/><line x1="1200" y1="494" x2="1200" y2="560"/>
  </g>
  <rect x="980" y="450" width="90" height="44" rx="4" fill="#151b24" stroke="#2997FF" stroke-width="2"/>
  <text x="1025" y="478" text-anchor="middle" fill="#2997FF" font-family="system-ui,sans-serif" font-size="14" font-weight="600">GATE</text>
  <!-- Road -->
  <rect y="560" width="1600" height="340" fill="url(#road)"/>
  <path d="M0 700 Q400 660 800 700 T1600 690" fill="none" stroke="#2f3640" stroke-width="7"/>
  <path d="M0 760 Q500 720 1000 760 T1600 750" fill="none" stroke="#222830" stroke-width="4" stroke-dasharray="22 30"/>
  <!-- Lamp -->
  <circle cx="1240" cy="300" r="12" fill="#ffd27a"/>
  <path d="M1240 312 L1240 450" stroke="#ffd27a" stroke-width="3" opacity="0.3"/>
  <path d="M1240 320 L1180 560 L1300 560 Z" fill="#ffd27a" opacity="0.06"/>
</svg>
